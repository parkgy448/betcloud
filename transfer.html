<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
    body { font-family: 'Noto Sans KR', sans-serif; background-color: #0a0a12; color: white; }
    .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .btn-orange { background-color: #f97316; }
    .btn-orange:hover { background-color: #ea580c; }
    .loading-dots span { animation: blink 1.2s infinite both; }
    .loading-dots span:nth-child(2) { animation-delay: .2s; }
    .loading-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 20% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
    .swap-btn:active { transform: scale(0.95) rotate(180deg); }
  </style>
</head>

        </div>

        <!-- Amount Input -->

          <label class="text-sm text-gray-300 mb-2 block">전환할 금액</label>
          <div class="relative">
            <input type="text" id="transfer-amount" placeholder="금액 입력" class="w-full bg-gray-800 rounded px-3 py-3 text-center font-bold tracking-wider">

        </div>

        <!-- Quick Amount Buttons -->

          <button class="quick-amount-btn bg-gray-700 hover:bg-gray-600 rounded py-2" data-amount="10000">1만</button>
          <button class="quick-amount-btn bg-gray-700 hover:bg-gray-600 rounded py-2" data-amount="50000">5만</button>
          <button class="quick-amount-btn bg-gray-700 hover:bg-gray-600 rounded py-2" data-amount="100000">10만</button>
          <button class="quick-amount-btn bg-gray-700 hover:bg-gray-600 rounded py-2" data-amount="500000">50만</button>
          <button id="max-amount-btn" class="bg-gray-700 hover:bg-gray-600 rounded py-2">전액</button>
        </div>

        <!-- Password -->

          <label class="text-sm text-gray-300 mb-2 block">출금 비밀번호</label>

        </div>

          <button id="submit-transfer-btn" class="w-full btn-orange text-white py-3 rounded-lg font-bold text-base transition">전환하기</button>

  <!-- Loading Overlay -->
  <div id="overlay" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80">
    <div class="bg-gray-900 rounded-2xl px-6 py-5 shadow-xl flex items-center">
      <i data-feather="loader" class="w-6 h-6 text-orange-400 mr-3 animate-spin"></i>
      <div class="text-sm leading-6">
        <div class="font-bold">로딩중입니다<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span></div>
        <div class="text-gray-300">잠시만 기다려주세요.</div>
      </div>
    </div>

  <script>
    // Casino game link script (unchanged)
    function openProvider(name) {
      const ov = document.getElementById('overlay');
      if (ov) {
          const loadingText = ov.querySelector('.font-bold');
          if(loadingText) loadingText.innerHTML = '게임 페이지로 이동중입니다<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span>';
          ov.classList.remove('hidden');
      }
      setTimeout(() => {
        window.location.href = 'https://hj1au6t5xe.lnaeyrfjti.net/gs2c/playGame.do?key=token%3D208f801db2c44772a45bd74b09a49b78%60%7C%60symbol%3D101%60%7C%60technology%3DH5%60%7C%60platform%3DWEB%60%7C%60language%3Dko%60%7C%60currency%3DKRW%60%7C%60cashierUrl%3Dhttp%3A%2F%2Fout_public.enjoycx.com%2Fexit%60%7C%60lobbyUrl%3Dhttp%3A%2F%2Fout_public.enjoycx.com%2Fexit&ppkv=2&stylename=veda_swix&country=KR&ctlgroup=veda_E&isGameUrlApiCalled=true';
      }, 1500);
    }

    // New Transfer UI Logic
    document.addEventListener('DOMContentLoaded', () => {
        feather.replace();

        const db = firebase.firestore();
        const auth = firebase.auth();
        
        let currentUser = null;
        let userBalances = { game: 0, casino: 0 };
        let transferDirection = 'game_to_casino'; // 'game_to_casino' or 'casino_to_game'

        // --- Element Refs ---
        const gameBalanceEl = document.getElementById('game-balance');
        const casinoBalanceEl = document.getElementById('casino-balance');
        const fromWalletNameEl = document.getElementById('from-wallet-name');
        const toWalletNameEl = document.getElementById('to-wallet-name');
        const swapBtn = document.getElementById('swap-btn');
        const amountInput = document.getElementById('transfer-amount');
        const sourceBalanceInfoEl = document.getElementById('source-balance-info');
        const passwordInput = document.getElementById('password');
        const togglePwBtn = document.getElementById('toggle-pw-btn');
        const submitBtn = document.getElementById('submit-transfer-btn');
        const quickAmountBtns = document.querySelectorAll('.quick-amount-btn');
        const maxAmountBtn = document.getElementById('max-amount-btn');
        const overlay = document.getElementById('overlay');

        // --- Functions ---
        const showLoading = (text) => {
            if (overlay) {
                overlay.querySelector('.font-bold').innerHTML = text || '처리중...<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span>';
                overlay.classList.remove('hidden');
            }
        };

        const hideLoading = () => {
            if (overlay) overlay.classList.add('hidden');
        };

        const formatCurrency = (num) => num.toLocaleString() + ' 원';

        const updateUIForDirection = () => {
            const isGameToCasino = transferDirection === 'game_to_casino';
            fromWalletNameEl.textContent = isGameToCasino ? '게임 머니' : '카지노 머니';
            toWalletNameEl.textContent = isGameToCasino ? '카지노 머니' : '게임 머니';
            const sourceBalance = isGameToCasino ? userBalances.game : userBalances.casino;
            sourceBalanceInfoEl.textContent = `보유: ${formatCurrency(sourceBalance)}`;
            amountInput.value = '';
        };

        const swapDirection = () => {
            transferDirection = transferDirection === 'game_to_casino' ? 'casino_to_game' : 'game_to_casino';
            updateUIForDirection();
        };

        const updateUserBalances = async () => {
            if (!currentUser) return;
            const userRef = db.collection('users').doc(currentUser.uid);
            try {
                const doc = await userRef.get();
                if (doc.exists) {
                    const data = doc.data();
                    userBalances.game = data.balance || 0;
                    userBalances.casino = data.casinoBalance || 0;
                    gameBalanceEl.textContent = formatCurrency(userBalances.game);
                    casinoBalanceEl.textContent = formatCurrency(userBalances.casino);
                    updateUIForDirection(); // Update source balance info
                }
            } catch (error) {
                console.error("Error fetching user balances:", error);
                gameBalanceEl.textContent = '에러';
                casinoBalanceEl.textContent = '에러';
            }
        };

        const handleTransfer = async () => {
            if (!currentUser) return alert('로그인이 필요합니다.');

            const amount = parseInt(amountInput.value.replace(/[^0-9]/g, ''), 10);
            const password = passwordInput.value;

            if (isNaN(amount) || amount <= 0) return alert('유효한 금액을 입력하세요.');
            if (!password) return alert('출금 비밀번호를 입력하세요.');

            const from = transferDirection === 'game_to_casino' ? 'game' : 'casino';
            const to = transferDirection === 'game_to_casino' ? 'casino' : 'game';
            
            const sourceBalance = from === 'game' ? userBalances.game : userBalances.casino;
            if (amount > sourceBalance) return alert('보유 금액이 부족합니다.');

            showLoading('머니를 안전하게 전환하는 중...');

            try {
                const userToken = await currentUser.getIdToken();
                const functionUrl = 'https://asia-northeast3-cloud-casino-34cc6.cloudfunctions.net/transferMoney';

                const response = await fetch(functionUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + userToken },
                    body: JSON.stringify({ data: { amount, from, to, password } })
                });

                const result = await response.json();
                if (!response.ok) throw new Error(result.error || '서버 오류');

                alert('자금 전환이 완료되었습니다.');
                passwordInput.value = '';
                amountInput.value = '';
                await updateUserBalances();

            } catch (error) {
                console.error('Transfer error:', error);
                alert(`오류: ${error.message}`);
            } finally {
                hideLoading();
            }
        };

        // --- Event Listeners ---
        swapBtn.addEventListener('click', swapDirection);

        togglePwBtn.addEventListener('click', () => {
            passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
        });

        amountInput.addEventListener('input', (e) => {
            const value = e.target.value.replace(/[^0-9]/g, '');
            e.target.value = value ? parseInt(value, 10).toLocaleString() : '';
        });

        quickAmountBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const amount = btn.dataset.amount;
                amountInput.value = parseInt(amount).toLocaleString();
            });
        });

        maxAmountBtn.addEventListener('click', () => {
            const sourceBalance = transferDirection === 'game_to_casino' ? userBalances.game : userBalances.casino;
            amountInput.value = sourceBalance.toLocaleString();
        });

        submitBtn.addEventListener('click', handleTransfer);

        // --- Auth State ---
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                updateUserBalances();
            } else {
                alert('로그인이 필요합니다.');
                window.location.href = 'index.html';
            }
        });
    });
  </script>
</body>
</html>
