        function showUnderMaintenance(message) {
            const msg = message || "현재 점검 중입니다. 빠른 시일 내에 서비스가 재개될 예정입니다.";
            // If not logged in, fallback to simple alert (login flow might call this)
            try {
                if (typeof auth !== 'undefined' && auth && !auth.currentUser) {
                    alert(msg);
                    return;
                }
            } catch(e) {}

            // If overlay exists, update message and show
            let overlay = document.getElementById('maintOverlay');
            if (overlay) {
                const txt = overlay.querySelector('.maint-msg');
                if (txt) txt.textContent = msg;
                overlay.classList.remove('hidden');
                overlay.querySelector('.maint-card')?.classList.add('maint-show');
                return;
            }

            overlay = document.createElement('div');
            overlay.id = 'maintOverlay';
            overlay.className = 'fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-70';
            overlay.innerHTML = `
                <div class="maint-card max-w-md w-full mx-4 p-6 rounded-xl bg-gradient-to-r from-orange-600 to-orange-400 text-white shadow-2xl transform transition-all scale-95 opacity-0">

                        <button aria-label="닫기" id="maintCloseBtn" class="text-white text-2xl ml-4 leading-none">&times;</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
            // animate in
            requestAnimationFrame(() => {
                const card = overlay.querySelector('.maint-card');
                if (card) {
                    card.classList.remove('scale-95');
                    card.style.opacity = '1';
                    card.classList.add('maint-show');
                }
            });

            // close handlers
            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) hideMaintOverlay();
            });
            const closeBtn = document.getElementById('maintCloseBtn');
            if (closeBtn) closeBtn.addEventListener('click', hideMaintOverlay);
        }

        function hideMaintOverlay() {
            const overlay = document.getElementById('maintOverlay');
            if (!overlay) return;
            const card = overlay.querySelector('.maint-card');
            if (card) {
                card.classList.remove('maint-show');
                card.style.opacity = '0';
            }
            setTimeout(() => {
                overlay.remove();

        function handleGameClick(url) {
            const user = auth.currentUser;
            if (!user) {
                openModal("loginModal");
                return;
            }

            db.collection("users").doc(user.uid).get().then((doc) => {
                if (!doc.exists || doc.data().status !== "active") {
                    alert("승인 대기 중인 계정입니다. 관리자 승인 후 이용 가능합니다.");
                    return;
                }

                const overlay = document.getElementById('redirectOverlay');
                const card = document.getElementById('redirectCard');
                const message = document.getElementById('redirectMessage');
                const progressBar = document.getElementById('progressBar');

                if (!overlay || !card || !message || !progressBar) return;

                // Reset and show overlay
                message.textContent = '로딩중...';
                progressBar.style.width = '0%';
                overlay.classList.remove('hidden');
                
                // Animate in
                requestAnimationFrame(() => {
                    card.classList.remove('scale-95', 'opacity-0');
                });

                // Step 1: Loading
                setTimeout(() => {
                    progressBar.style.width = '50%';
                    
                    // Step 2: Redirecting
                    setTimeout(() => {
                        message.textContent = '이동중...';
                        progressBar.style.width = '100%';

                        // Step 3: Open URL and hide
                        setTimeout(() => {
                            window.open(url, '_blank');
                            
                            // Animate out
                            card.classList.add('scale-95', 'opacity-0');
                            setTimeout(() => {
                                overlay.classList.add('hidden');
                            }, 300); // Match animation duration

                        }, 500); // A brief moment to see the "Redirecting" state
                    }, 1000); // Loading duration
                }, 100); // Short delay to allow animation-in to start
            }).catch(error => {
                console.error("Error getting user data:", error);
                alert("오류가 발생했습니다. 다시 시도해주세요.");
            });
        }

                        container.className = "flex flex-col md:flex-row md:items-center md:justify-between";

                        const infoDiv = document.createElement('div');
                        const infoFlex = document.createElement('div');
                        infoFlex.className = "flex items-center flex-wrap gap-2";

                        const nameHeader = document.createElement('h3');
                        nameHeader.className = "font-bold text-lg mr-2";
                        // XSS 방지를 위해 사용자 입력 데이터는 textContent로 처리합니다.
                        nameHeader.textContent = `${userData.name || userData.userId} 님`;

                        const pointSpan = document.createElement('span');
                        pointSpan.className = "bg-yellow-100 text-yellow-800 text-xs px-2 py-1 rounded";
                        pointSpan.textContent = `${(userData.point || 0).toLocaleString()}P`;

                        const balanceSpan = document.createElement('span');
                        balanceSpan.className = "bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded";
                        balanceSpan.textContent = `${(userData.balance || 0).toLocaleString()}원`;

                        infoFlex.appendChild(nameHeader);
                        infoFlex.appendChild(pointSpan);
                        infoFlex.appendChild(balanceSpan);
                        infoDiv.appendChild(infoFlex);

                        const buttonsDiv = document.createElement('div');
                        buttonsDiv.className = "mt-3 md:mt-0 flex space-x-2";

                        // 보안 참고: 아래 버튼 숨김 처리는 UI/UX 목적이며 보안 기능이 아닙니다.
                        // admin.html 페이지 자체에서 반드시 사용자가 관리자인지 재확인해야 합니다.
                        if (isAdmin) {
                            const adminLink = document.createElement('a');
                            adminLink.href = "admin.html";
                            adminLink.className = "bg-gradient-to-r from-orange-500 to-yellow-500 text-white px-4 py-2 rounded-md font-bold glow-orange";
                            adminLink.textContent = "관리자페이지";
                            buttonsDiv.appendChild(adminLink);
                        }

                        const logoutButton = document.createElement('button');
                        logoutButton.className = "bg-gradient-to-r from-yellow-500 to-orange-500 text-white px-4 py-2 rounded-md font-bold glow-orange";
                        logoutButton.textContent = "로그아웃";
                        logoutButton.onclick = logout;

                        buttonsDiv.appendChild(logoutButton);
                        
                        container.appendChild(infoDiv);
                        container.appendChild(buttonsDiv);

                        userInfoSection.appendChild(container);
                    }
                });
            } else {
                userInfoSection.innerHTML = `
                    <div class="flex flex-col md:flex-row md:items-center md:justify-between">
                        <div>
                            <h3 class="font-bold text-lg">낙엽카지노에 오신 것을 환영합니다</h3>
                            <p class="text-sm text-gray-300 mt-1">로그인 후 모든 서비스를 이용하세요</p>
                        </div>
                        
                        <div class="w-full md:w-auto mt-4 md:mt-0">
                            <div class="grid grid-cols-3 gap-2 w-full">
                                <button onclick="openModal('loginModal')" class="w-full h-12 md:h-16 rounded-lg text-lg md:text-2xl font-extrabold text-white shadow-lg bg-gradient-to-r from-orange-500 to-amber-500">로그인</button>
                                <button onclick="openModal('registerModal')" class="w-full h-12 md:h-16 rounded-lg text-lg md:text-2xl font-extrabold text-white shadow-lg bg-gradient-to-r from-amber-400 to-yellow-500">회원가입</button>
                                <button class="w-full h-12 md:h-16 rounded-lg text-lg md:text-2xl font-extrabold text-white shadow-lg bg-gradient-to-r from-emerald-400 to-green-500">무기명가입</button>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        // Login Function
        document.getElementById("loginSubmit").addEventListener("click", async function () {
            const userId = document.getElementById("loginId").value.trim();
            const password = document.getElementById("loginPassword").value.trim();

            if (!userId || !password) {
                alert("아이디와 비밀번호를 입력해주세요.");
                return;
            }

            showLoading();
            try {
                const userCredential = await auth.signInWithEmailAndPassword(`${userId}@betcloud.com`, password);
                const userDoc = await db.collection("users").doc(userCredential.user.uid).get();
                
                if (!userDoc.exists) {
                    await auth.signOut();
                    alert("등록되지 않은 사용자입니다.");
                    return;
                }

                const userData = userDoc.data();
                if (userData.status !== "active") {
                    await auth.signOut();
                    alert("승인 대기 중인 계정입니다. 관리자 승인 후 이용 가능합니다.");
                    return;
                }

                updateAuthUI(userData);
                closeModal("loginModal");
                // 환영 알림은 auth.js 또는 상위 로직에서 처리하므로 중복 방지
                // alert(`${userData.name || userData.userId}님, 환영합니다!`);
            } catch (error) {
                console.error("로그인 오류:", error);
                let errorMessage = "로그인 중 오류가 발생했습니다.";
                if (error.code === "auth/user-not-found") {
                    errorMessage = "등록되지 않은 아이디입니다.";
                } else if (error.code === "auth/wrong-password") {
                    errorMessage = "비밀번호가 일치하지 않습니다.";
                }
                alert(errorMessage);
            } finally {
                hideLoading();
            }
        });

        // Register Function
        document.getElementById("registerSubmit").addEventListener("click", async function () {
            const userId = document.getElementById("regId").value.trim();
            const password = document.getElementById("regPassword").value.trim();
            const passwordConfirm = document.getElementById("regPasswordConfirm").value.trim();
            const name = document.getElementById("regName").value.trim();
            const bank = document.getElementById("regBank").value;
            const account = document.getElementById("regAccount").value.trim();
            const accountName = document.getElementById("regAccountName").value.trim();
            const withdrawPassword = document.getElementById("withdrawPassword").value.trim();

            if (!userId || !password || !passwordConfirm || !name || !bank || !account || !accountName || !withdrawPassword) {
                alert("모든 필수 항목을 입력해주세요.");
                return;
            }

            if (password !== passwordConfirm) {
                alert("비밀번호가 일치하지 않습니다.");
                return;
            }

            showLoading();
            try {
                const userCredential = await auth.createUserWithEmailAndPassword(`${userId}@betcloud.com`, password);
                
                const userData = {
                    userId,
                    name,
                    bank,
                    account,
                    accountName,
                    balance: 0,
                    point: 0,
                    joinDate: new Date().toISOString(),
                    status: "pending",
                    isAdmin: false,
                    // 중요: 출금 비밀번호가 평문으로 전송됩니다.
                    // 반드시 Firebase Function과 같은 서버 환경에서 해싱(암호화)해야 합니다.
                    withdrawPassword: withdrawPassword,
                };

                await db.collection("users").doc(userCredential.user.uid).set(userData);
                await db.collection("approvalRequests").add({
                    userId: userCredential.user.uid,
                    status: "pending",
                    requestDate: new Date().toISOString(),
                    userInfo: { name, userId, joinDate: userData.joinDate, bank, account, accountName }
                });

                await auth.signOut();
                updateAuthUI(null);
                closeModal("registerModal");
                alert("회원가입 신청이 완료되었습니다. 관리자 승인 후 로그인이 가능합니다.");
            } catch (error) {
                console.error("회원가입 오류:", error);
                alert("회원가입 중 오류가 발생했습니다: " + error.message);
                try {
                    await auth.signOut();
                    updateAuthUI(null);
                } catch (logoutError) {
                    console.error("로그아웃 오류:", logoutError);
                }
            } finally {
                hideLoading();
            }
        });

        // Logout Function
        async function logout() {
            try {
                await auth.signOut();
                updateAuthUI(null);
                alert("로그아웃 되었습니다.");
            } catch (error) {
                console.error("로그아웃 오류:", error);
                alert("로그아웃 중 오류가 발생했습니다.");
            }
        }

        // Auth State Listener
        auth.onAuthStateChanged((user) => {
            updateAuthUI(user);
        });

        // Initialize
        feather.replace();
        updateAuthUI(auth.currentUser);
    </script>

<script>
/*
  Live-only Announcements & Events (Firestore)
  - Requires firebase initialized globally.
  - Listens in real-time and updates the page when admin edits collections.
*/

function makeItemRow(prefix, title) {
  const li = document.createElement('li');
  li.className = 'flex items-start gap-2';
  const tag = document.createElement('span');
  
  let tagClass = 'text-yellow-300 text-xs font-semibold'; // Default for RULE
  if (prefix.includes("EVENT")) {
    tagClass = 'text-green-300 text-xs font-semibold';
  } else if (prefix.includes("MSG")) {
    tagClass = 'text-blue-300 text-xs font-semibold';
  }
  tag.className = tagClass;

  tag.innerText = prefix + ' -';
  const txt = document.createElement('span');
  txt.className = 'flex-1 text-gray-100';
  txt.innerText = title;
  li.appendChild(tag);
  li.appendChild(txt);
  return li;
}

function attachLiveNotices() {
  const db = firebase.firestore();
  const annContainer = document.querySelector('#announcements-list');
  const evtContainer = document.querySelector('#events-list');
  const msgContainer = document.querySelector('#messages-list');

  if (!annContainer || !evtContainer || !msgContainer) return;

  // real-time listeners (ordered by 'order' then createdAt)
  db.collection('announcements').where('active','==', true).orderBy('order','asc').onSnapshot((snap) => {
    annContainer.innerHTML = '';
    snap.forEach(doc => {
      const data = doc.data();
      const title = data.title || '';
      annContainer.appendChild(makeItemRow('RULE', title));
    });
  }, (err) => console.error('ann listener err', err));

  db.collection('events').where('active','==', true).orderBy('order','asc').onSnapshot((snap) => {
    evtContainer.innerHTML = '';
    snap.forEach(doc => {
      const data = doc.data();
      const title = data.title || '';
      evtContainer.appendChild(makeItemRow('EVENT', title));
    });
  }, (err) => console.error('evt listener err', err));

  // New listener for messages
  db.collection('messages').orderBy('timestamp','desc').limit(5).onSnapshot((snap) => {
    msgContainer.innerHTML = '';
    snap.forEach(doc => {
      const data = doc.data();
      const title = data.title || '';
      msgContainer.appendChild(makeItemRow('MSG', title));
    });
  }, (err) => console.error('msg listener err', err));
}

document.addEventListener('DOMContentLoaded', () => {
  if (window.firebase && firebase.firestore) {
    attachLiveNotices();
  } else {
    console.warn('Firebase not initialized before live notices script.');
  }
});
</script>
<!-- END: Live Announcements & Events (Firestore) -->



<script>

// Guard function for Casino / Money Transfer access
function guardMoneyTransfer() {
    // Helper to open login modal if available, else redirect to login page
    function openLoginUI() {
        if (typeof openModal === 'function') {
            try { openModal('loginModal'); return; } catch(e) {}
        }
        if (typeof showLoginModal === 'function') {
            try { showLoginModal(); return; } catch(e) {}
        }
        // fallback: redirect to login page
        window.location.href = 'login.html';
    }

    // Try Firebase auth if available
    try {
        if (typeof auth !== 'undefined' && auth && auth.currentUser) {
            var user = auth.currentUser;
            // check firestore if available
            if (typeof db !== 'undefined' && db) {
                db.collection("users").doc(user.uid).get()
                .then((doc) => {
                    if (!doc.exists) {
                        // Not in firestore: sign out and prompt login
                        if (typeof auth.signOut === 'function') auth.signOut().catch(()=>{});
                        openLoginUI();
                        return;
                    }
                    var userData = doc.data();
                    if (userData && userData.status && userData.status !== 'active') {
                        alert('승인 대기 중인 계정입니다. 관리자 승인 후 이용 가능합니다.');
                        return;
                    }
                    // All good - go to transfer page
                    window.location.href = 'transfer.html';
                })
                .catch((err) => {
                    console.error('guardMoneyTransfer firestore error:', err);
                    alert('오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
                });
            } else {
                // No firestore - assume authenticated user can proceed
                window.location.href = 'transfer.html';
            }
            return;
        }
    } catch(e) {
        console.warn('guardMoneyTransfer auth check failed', e);
    }

    // If no Firebase auth, try simple local login flag (app may set this)
    try {
        if (window.isLoggedIn === true || localStorage.getItem('userLoggedIn') === 'true') {
            // proceed
            window.location.href = 'transfer.html';
            return;
        }
    } catch(e) {}

    // Default: open login modal / redirect
    openLoginUI();
}

</script>

<script>
document.addEventListener("DOMContentLoaded", () => {
  function requireLogin(e, callback) {
    const user = auth.currentUser;
    if (!user) {
      e.preventDefault();
      openModal("loginModal");
      return false;
    }
    if (typeof callback === "function") callback();
  }

  const btnDeposit = document.querySelector('a[href="deposit.html"]');
  const btnExchange = document.querySelector('a[href="exchange.html"]');
  const btnTransfer = document.querySelector('a[href="transfer.html"]');
  const btnVote = document.querySelector('button[onclick="showUnderMaintenance()"]');
  const btnFortune = document.querySelector('a[href*="shinhanlife.sinbiun.com"]');
  const btnRoulette = document.querySelector('a[href="roulette.html"]');

  if (btnDeposit)
    btnDeposit.addEventListener("click", e =>
      requireLogin(e, () => (window.location.href = "deposit.html"))
    );

  if (btnExchange)
    btnExchange.addEventListener("click", e =>
      requireLogin(e, () => (window.location.href = "exchange.html"))
    );

  if (btnTransfer)
    btnTransfer.addEventListener("click", e =>
      requireLogin(e, () => (window.location.href = "transfer.html"))
    );

  if (btnVote)
    btnVote.addEventListener("click", e =>
      requireLogin(e, () => showUnderMaintenance())
    );

  if (btnFortune)
    btnFortune.addEventListener("click", e =>
      requireLogin(e, () => window.open(btnFortune.href, "_blank"))
    );

  if (btnRoulette)
    btnRoulette.addEventListener("click", e =>
      requireLogin(e, () => (window.location.href = "roulette.html"))
    );
});
</script>
